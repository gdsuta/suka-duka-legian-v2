name: Keep Supabase Alive

# Supabase free-tier projects auto-pause after 7 days without activity.
# This pings the REST API every 3 days so the project never goes idle
# long enough to pause. Uses the public anon key (safe — same key
# already shipped to the browser bundle).

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/anggota?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -o /dev/null
